  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b(E.s),iterations:E.it},km,512));}
async function open_(raw){
  const [ek,mk]=await keys(raw), s=b(E.s), n=b(E.n), c=b(E.c), t=b(E.t);
  const msg=new Uint8Array(s.length+n.length+c.length); msg.set(s);msg.set(n,s.length);msg.set(c,s.length+n.length);
  if(!await crypto.subtle.verify("HMAC",mk,t,msg)) return null;
  const nb=Math.ceil(c.length/32), blocks=[];
  for(let i=0;i<nb;i+=512){const ps=[];for(let j=i;j<Math.min(nb,i+512);j++){const m=new Uint8Array(20);m.set(n);new DataView(m.buffer).setUint32(16,j);ps.push(crypto.subtle.sign("HMAC",ek,m));}
    (await Promise.all(ps)).forEach(x=>blocks.push(new Uint8Array(x)));}
  const out=new Uint8Array(c.length); for(let i=0;i<c.length;i++) out[i]=c[i]^blocks[i>>5][i&31];
  const ds=new Blob([out]).stream().pipeThrough(new DecompressionStream("deflate"));
  return await new Response(ds).text();}
